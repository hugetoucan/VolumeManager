on:
  push:
    branches:
      - main
    paths-ignore:
      - README.md
      - fastlane/**
  pull_request:
    branches:
      - main
    paths-ignore:
      - README.md
      - fastlane/**
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Build
        run: ./gradlew assembleRelease

      - name: Sign APK
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_FILE" | base64 -d > keystore.jks
          $ANDROID_HOME/build-tools/34.0.0/zipalign -c -v 4 app/build/outputs/apk/release/app-release-unsigned.apk
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
            --ks keystore.jks \
            --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass env:KEY_PASSWORD \
            app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Verify APK signature
        run: $ANDROID_HOME/build-tools/34.0.0/apksigner verify --verbose --print-certs app/build/outputs/apk/release/app-release-unsigned.apk

      - run: cp app/build/outputs/apk/release/app-release-unsigned.apk volume-manager.apk

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          path: volume-manager.apk
          archive: false
